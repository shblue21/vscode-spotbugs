name: Extension Checks

on:
  push:
    branches:
      - '**'
    paths: &extension_paths
      - 'src/**'
      - 'l10n/**'
      - 'test-fixtures/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '*.config.*'
      - '.*ignore'
      - '.github/workflows/extension-checks.yml'
  pull_request:
    paths: *extension_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Prettier (check)
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit
