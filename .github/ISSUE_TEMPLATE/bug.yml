name: Bug report
description: Report a bug in the SpotBugs VS Code extension.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and pull requests before reporting. Do not include private code, credentials, or sensitive data.
        For security reports, follow [SUPPORT.md](https://github.com/shblue21/vscode-spotbugs/blob/main/SUPPORT.md).

  - type: textarea
    id: details
    attributes:
      label: Bug description
      description: Include what happened, how to reproduce it, and what you expected.
      placeholder: |
        What happened?

        Steps to reproduce:
        1.
        2.

        Expected behavior:
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Optional. Include the details relevant to the problem.
      value: |
        - OS:
        - VS Code version:
        - SpotBugs extension version:
        - Red Hat Java extension version:
        - Java version:
        - Project type (Maven, Gradle, or other):
        - SpotBugs command:
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Optional. Add logs from Output → SpotBugs, screenshots, or a small sample project.
      placeholder: Paste logs, add screenshots, or link a small sample repository.
    validations:
      required: false
